; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:rpipico2]
; Pinned for reproducible builds: this platform commit also pins the arduino-pico core
; (earlephilhower/arduino-pico@9a0bc35). Update deliberately and re-test after changing it.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#9c167c6b8aac4f4cfa6d55a0c4e5b848795150c0
board = rpipico2
framework = arduino
board_build.core = earlephilhower
upload_port = COM8
monitor_speed = 115200
; Flash filesystem for Settings.ini and flight logs (see "Flight Log Storage" in
; SOFTWARE_DESIGN.md). Changing this size reformats the filesystem on the next boot:
; existing logs and Settings.ini are erased.
board_build.filesystem_size = 2M
extra_scripts = pre:generate_version.py
; The core links newlib-nano, whose printf prints nothing for %f. Settings.ini, the flight
; log CSV and serial output all format floats with printf, so float support is required.
build_flags = -Wl,-u,_printf_float

; Recovery only: set true when an existing board cannot boot far enough for
; DUMP_OTP, but is already provisioned and is currently in RP2350 BOOTSEL mode.
; This bypasses host-side OTP probing; it does not enable OTP provisioning.
custom_otp_preflight_bypass = false

; Recovery only: skip filesystem writes when an existing unit hangs while
; closing Settings.ini. OTP and filesystem reads remain enabled.
custom_recovery_skip_filesystem_writes = false

; Exact versions so a library release can never change the flight firmware silently.
; The ICM-45686 IMU is driven directly over SPI, so no IMU library is needed.
lib_deps =
	adafruit/Adafruit NeoPixel@1.15.5
	sparkfun/SparkFun BMP581 Arduino Library@1.0.2
